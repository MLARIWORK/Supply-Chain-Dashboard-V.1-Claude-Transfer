        </div>
      );
    };
    
    // ============================================
    // CATALOG TABLE
    // ============================================
    
    const CatalogTable = () => {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedItem, setSelectedItem] = useState(null);
      const [segmentFilter, setSegmentFilter] = useState([]);
      const [riskFilter, setRiskFilter] = useState([]);
      
      const allItems = useMemo(() => {
        return segments.flatMap(segment =>
          segment.items.map(item => ({
            ...item,
            segmentId: segment.id,
            segmentName: segment.name,
          }))
        );
      }, []);
      
      const filteredItems = useMemo(() => {
        return allItems.filter(item => {
          const matchesSearch = !searchQuery || 
            item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.segmentName.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (item.policyBite && item.policyBite.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchesSegment = segmentFilter.length === 0 || segmentFilter.includes(item.segmentId);
          const matchesRisk = riskFilter.length === 0 || riskFilter.includes(item.risk);
          return matchesSearch && matchesSegment && matchesRisk;
        });
      }, [allItems, searchQuery, segmentFilter, riskFilter]);
      
      const getRiskDescription = (item) => {
        if (item.policyBite) return item.policyBite;
        if (item.structuralRisks && item.structuralRisks.length > 0) return item.structuralRisks[0];
        return item.description?.slice(0, 100) + '...' || 'No description available';
      };
      
      return (
        <>
          <div className="mt-10 bg-white rounded-lg border border-gray-200 shadow-card overflow-hidden">
            <div className="p-5 border-b border-gray-200">
              <h2 className="text-lg font-semibold text-gray-800 mb-0.5">Supply Chain Catalog</h2>
              <p className="text-xs text-gray-500">
                Complete inventory of {allItems.length} items across all segments
              </p>
            </div>
            
            <div className="p-4 bg-gray-50 border-b border-gray-200">
              <div className="flex flex-wrap gap-3 items-center">
                <select
                  className="bg-white border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[hsl(226,50%,23%)]/20"
                  value={segmentFilter[0] || ''}
                  onChange={(e) => setSegmentFilter(e.target.value ? [e.target.value] : [])}
                >
                  <option value="">All Segments</option>
                  {segments.map(s => (
                    <option key={s.id} value={s.id}>{s.name}</option>
                  ))}
                </select>
                
                <select
                  className="bg-white border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[hsl(226,50%,23%)]/20"
                  value={riskFilter[0] || ''}
                  onChange={(e) => setRiskFilter(e.target.value ? [e.target.value] : [])}
                >
                  <option value="">All Risk Levels</option>
                  <option value="high">High Risk</option>
                  <option value="medium">Medium Risk</option>
                  <option value="low">Low Risk</option>
                </select>
                
                <div className="relative flex-1 min-w-[200px]">
                  <Icon name="Search" className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" />
                  <input
                    type="text"
                    placeholder="Search all fields..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[hsl(226,50%,23%)]/20"
                  />
                </div>
                
                {(searchQuery || segmentFilter.length > 0 || riskFilter.length > 0) && (
                  <button
                    onClick={() => { setSearchQuery(''); setSegmentFilter([]); setRiskFilter([]); }}
                    className="text-sm text-gray-500 hover:text-gray-700"
                  >
                    Clear filters
                  </button>
                )}
              </div>
            </div>
            
            <div className="max-h-[480px] overflow-auto">
              <table className="w-full">
                <thead className="sticky top-0 bg-gray-100/90 backdrop-blur-sm z-10">
                  <tr className="border-b border-gray-200">
                    <th className="text-left font-medium text-gray-700 text-xs uppercase tracking-wide px-4 py-3 w-[150px]">Segment</th>
                    <th className="text-left font-medium text-gray-700 text-xs uppercase tracking-wide px-4 py-3 w-[170px]">Item</th>
                    <th className="text-left font-medium text-gray-700 text-xs uppercase tracking-wide px-4 py-3">Risk Level Description</th>
                    <th className="text-left font-medium text-gray-700 text-xs uppercase tracking-wide px-4 py-3 w-[130px]">Market Type</th>
                  </tr>
                </thead>
                <tbody>
                  {filteredItems.map((item) => (
                    <tr 
                      key={`${item.segmentId}-${item.id}`}
                      className="border-b border-gray-100 hover:bg-gray-50 cursor-pointer transition-colors"
                      onClick={() => setSelectedItem(item)}
                    >
                      <td className="px-4 py-3 text-sm text-gray-500">{item.segmentName}</td>
                      <td className="px-4 py-3 font-medium text-sm text-gray-800">{item.name}</td>
                      <td className="px-4 py-3">
                        <div className="flex items-start gap-2.5">
                          <span className={cn(
                            "text-xs font-medium px-2 py-0.5 rounded border whitespace-nowrap",
                            getRiskBadgeClass(item.risk)
                          )}>
                            {item.risk}
                          </span>
                          <span className="text-xs text-gray-500 line-clamp-2 leading-relaxed">
                            {getRiskDescription(item)}
                          </span>
                        </div>
                      </td>
                      <td className="px-4 py-3">
                        <span className={cn(
                          "text-xs font-medium px-2 py-0.5 rounded border",
                          getMarketTypeStyle(getMarketType(item))
                        )}>
                          {getMarketType(item)}
                        </span>
                      </td>
                    </tr>
                  ))}
                  {filteredItems.length === 0 && (
                    <tr>
                      <td colSpan={4} className="text-center py-8 text-gray-500 text-sm">
                        No items match your filters
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
            
            <div className="p-3 bg-gray-50 border-t border-gray-200">
              <p className="text-xs text-gray-500 text-center">
                Showing {filteredItems.length} of {allItems.length} total supply chain items • Click a row to view details
              </p>
            </div>
          </div>
          
          {selectedItem && (
            <FactSheetPanel
              item={selectedItem}
              segmentName={selectedItem.segmentName}
              onClose={() => setSelectedItem(null)}
            />
          )}
        </>
      );
    };
    
    // ============================================
    // EXPANDED FIELDS VIEW
    // ============================================
    
    const ExpandedFieldsView = ({ initialSegment, onBack }) => {
      const [currentSegment, setCurrentSegment] = useState(initialSegment);
      const [selectedItem, setSelectedItem] = useState(null);
      
      return (
        <main className="min-h-screen bg-[hsl(220,20%,98%)]">
          <header className="w-full px-6 py-4 border-b border-gray-200 bg-white">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <button
                onClick={onBack}
                className="flex items-center gap-2 text-sm text-gray-600 hover:text-gray-800 transition-colors"
              >
                <Icon name="ArrowLeft" className="w-4 h-4" />
                Back to Dashboard
              </button>
              <h1 className="font-serif text-lg font-bold text-gray-800">{currentSegment.name}</h1>
            </div>
          </header>
          
          <section className="max-w-7xl mx-auto px-6 py-6">
            <div className="flex gap-2 mb-6 overflow-x-auto pb-2">
              {segments.map(segment => (
                <button
                  key={segment.id}
                  onClick={() => setCurrentSegment(segment)}
                  className={cn(
                    "px-4 py-2 rounded-lg text-sm font-medium transition-colors whitespace-nowrap",
                    currentSegment.id === segment.id
                      ? "bg-[hsl(226,50%,23%)] text-white"
                      : "bg-white text-gray-600 hover:bg-gray-100 border border-gray-200"
                  )}
                >
                  {segment.name}
                </button>
              ))}
            </div>
            
            <div className="bg-white rounded-lg border border-gray-200 shadow-card overflow-hidden">
              <div className="p-5 border-b border-gray-200">
                <h2 className="text-lg font-semibold text-gray-800">{currentSegment.name} Items</h2>
                <p className="text-sm text-gray-500 mt-1">{currentSegment.description}</p>
              </div>
              
              <div className="divide-y divide-gray-100">
                {currentSegment.items.map(item => (
                  <div
                    key={item.id}
                    className="p-5 hover:bg-gray-50 cursor-pointer transition-colors"
                    onClick={() => setSelectedItem({ ...item, segmentName: currentSegment.name })}
                  >
                    <div className="flex items-start justify-between">
                      <div className="flex-1">
                        <div className="flex items-center gap-3 mb-2">
                          <h3 className="font-semibold text-gray-800">{item.name}</h3>
                          <span className={cn(
                            "text-xs font-medium px-2 py-0.5 rounded border",
                            getRiskBadgeClass(item.risk)
                          )}>
                            {item.risk} risk
                          </span>
                          <span className={cn(
                            "text-xs font-medium px-2 py-0.5 rounded border",
                            getMarketTypeStyle(getMarketType(item))
                          )}>
                            {getMarketType(item)}
                          </span>
                        </div>
                        {item.policyBite && (
                          <p className="text-sm text-gray-600 mb-2">{item.policyBite}</p>
                        )}
                        <div className="flex flex-wrap gap-4 text-xs text-gray-500">
                          <span>Producers: {item.keyProducers.slice(0, 3).join(', ')}</span>
                          <span>Geography: {item.geography.slice(0, 3).join(', ')}</span>
                        </div>
                      </div>
                      <Icon name="ChevronRight" className="w-5 h-5 text-gray-400" />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>
          
          {selectedItem && (
            <FactSheetPanel
              item={selectedItem}
              segmentName={selectedItem.segmentName}
              onClose={() => setSelectedItem(null)}
            />
          )}
        </main>
      );
    };
    
    // ============================================
    // MAIN APP COMPONENT
    // ============================================
    
    const App = () => {
      const [selectedSegment, setSelectedSegment] = useState(null);
      const [hoveredSegment, setHoveredSegment] = useState(null);
      const [showExpandedFields, setShowExpandedFields] = useState(false);
      const segmentSectionRef = useRef(null);
      
      const handleSelectSegment = (segment) => {
        if (selectedSegment?.id === segment.id) {
          setSelectedSegment(null);
        } else {
          setSelectedSegment(segment);
          setTimeout(() => {
            if (segmentSectionRef.current) {
              const yOffset = -window.innerHeight * 0.1;
              const y = segmentSectionRef.current.getBoundingClientRect().top + window.scrollY + yOffset;
              window.scrollTo({ top: y, behavior: 'smooth' });
            }
          }, 50);
        }
      };
      
      if (showExpandedFields && selectedSegment) {
        return (
          <ExpandedFieldsView
            initialSegment={selectedSegment}
            onBack={() => setShowExpandedFields(false)}
          />
        );
      }
      
      const segmentNames = segments.map(s => s.name);
      
      return (
        <main className="min-h-screen bg-[hsl(220,20%,98%)]">
          {/* Header */}
          <header className="w-full px-6 py-3 border-b border-gray-200/50">
            <div className="max-w-7xl mx-auto">
              <span className="text-sm font-semibold text-[hsl(226,50%,23%)] tracking-tight">
                Americans for Responsible Innovation
              </span>
            </div>
          </header>
          
          {/* Introduction */}
          <section className="max-w-4xl mx-auto px-6 py-5 text-center">
            <h1 className="font-serif text-2xl md:text-3xl font-bold text-gray-800 tracking-tight mb-2">
              Frontier AI Supply Chain Dashboard
            </h1>
            <p className="font-serif text-sm md:text-base text-gray-500 italic mb-3">
              What goes into making a frontier large language model?
            </p>
            <p className="text-xs md:text-sm text-gray-500 leading-relaxed max-w-3xl mx-auto">
              This dashboard maps the supply chain underlying frontier large language model (LLM) development, 
              identifying key components and risk profiles across seven critical segments: {segmentNames.slice(0, -1).join(', ')}, and {segmentNames[segmentNames.length - 1]}.
            </p>
          </section>
          
          {/* Segments */}
          <section ref={segmentSectionRef} className="max-w-6xl mx-auto px-6 md:px-12 pb-10">
            <h2 className="font-serif text-lg md:text-xl font-bold text-gray-800 tracking-tight mb-4 text-center">
              End-to-End AI Supply Chain
            </h2>
            
            <div className="flex items-stretch gap-2 overflow-x-auto pb-4 mb-6">
              {segments.map((segment, index) => (
                <div key={segment.id} className="flex items-center">
                  <SegmentCard
                    segment={segment}
                    isSelected={selectedSegment?.id === segment.id}
                    isHovered={hoveredSegment === segment.id}
                    onSelect={() => handleSelectSegment(segment)}
                    onHover={(hovering) => setHoveredSegment(hovering ? segment.id : null)}
                  />
                  {index < segments.length - 1 && (
                    <Icon name="ChevronRight" className="w-5 h-5 text-gray-300 mx-1 flex-shrink-0" />
                  )}
                </div>
              ))}
            </div>
            
            {selectedSegment && (
              <SegmentDetailPanel
                segment={selectedSegment}
                onViewExpanded={() => setShowExpandedFields(true)}
                onClose={() => setSelectedSegment(null)}
              />
            )}
            
            <CatalogTable />
            
            <p className="text-xs text-gray-400 text-center mt-6">
              Last Updated: December 2024
            </p>
          </section>
          
          {/* Footer */}
          <footer className="w-full px-6 py-6 border-t border-gray-200/30 mt-8">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <p className="text-xs text-gray-400">
                © {new Date().getFullYear()} Americans for Responsible Innovation
              </p>
              <span className="text-xs text-gray-400">AI Supply Chain Dashboard</span>
            </div>
          </footer>
        </main>
      );
    };
    
    // ============================================
    // RENDER
    // ============================================
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
